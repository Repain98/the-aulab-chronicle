<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
<head th:insert="~{index :: navbar}"></head>

<div th:if="${param.notAuthorized}">
    <div class="alert alert-danger">Not authorized!</div>
</div>

<div class="alert alert-success" th:if="${successMessage}">
    <p th:text="${successMessage}"></p>
</div>

<div class="alert alert-success" th:if="${errorMessage}">
    <p th:text="${errorMessage}"></p>
</div>

<div class="container-fluid">
    <div class="row ms-5 vh-100 align-items-center">
        <div class="col-10">
            <h1 class="mb-5"> Welcome to <span class="display-4 fw-bold d-block">The Aulab Chronicle</span></h1>
        </div>
    </div>
</div>

<div class="container" th:if="${articles.size() > 0}">
    <div class="row justify-content-center">
        <div class="col-10 mb-5">
            <h1 class="text-center">Gli ultimi articoli</h1>
        </div>
    </div>
    <div class="row justify-content-center mb-5">
        <div class="col-12 col-md-4 d-flex justify-content-center" th:each="article: ${articles}">
            <div class="card mb-3" style="width: 18rem;">
                <img alt="..." class="card-img-top" th:if="${article.image != null}" th:src="${article.image.path}">
                <img alt="..." class="card-img-top" th:src="@{/images/default.jpg}"
                     th:unless="${article.image != null}">

                <div class="card-body">
                    <h5 class="card-title" th:text="${article.title}"></h5>
                    <p class="card-text" th:text="${article.subtitle}"></p>
                    <p class="card-text" th:text="${article.user.username}"></p>

                    <a class="btn btn-primary" th:href="@{/articles/detail/{id}(id=${article.id})}">Leggi</a>
                </div>
            </div>
        </div>
    </div>
</div>

<head th:insert="~{index :: footer}"></head>

<script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
