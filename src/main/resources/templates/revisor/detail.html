<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
<head th:insert="~{index :: navbar}"></head>

<div class="container-fluid p-5 bg-secondary-subtle text-center">
    <div class="row justify-content-center">
        <div class="col-12">
            <span class="h1">Articolo</span>
            <h2 th:text="${article.title}">Titolo</h2>
        </div>
    </div>
</div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 d-flex flex-column">
            <div class="carousel slide" id="carouselExample">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img alt="..." class="card-img-top" th:if="${article.image != null}"
                             th:src="${article.image.path}">
                        <img alt="..." class="card-img-top" th:src="@{/images/default.jpg}"
                             th:unless="${article.image != null}">
                    </div>
                </div>
                <button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#carouselExample"
                        type="button">
                    <span aria-hidden="true" class="carousel-control-prev-icon"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#carouselExample"
                        type="button">
                    <span aria-hidden="true" class="carousel-control-next-icon"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

            <div class="text-center">
                <h2 th:text="${article.subtitle}">Sottotitolo</h2>
            </div>

            <p class="fs-5" th:if="${article.category != null}">Categoria:
                <a class="text-capitalize fw-bold text-muted"
                   th:href="@{/categories/search/{id}(id=${article.category.id})}" th:text="${article.category.name}">categoria</a>
            </p>

            <p class="fs-5" th:if="${article.category == null}">Nessuna categoria</p>

            <div class="text-muted my-3">
                <p>Redatto il
                <p th:text="${article.publishDate}">data</p> da
                <a class="text-muted" th:href="@{/search/{id}(id=${article.user.id})}">
                    <p th:text="${article.user.username}">User</p>
                </a>
            </div>

        </div>
        <hr>
        <p th:text="${article.body}"></p>

        <div class="text-center">
            <a class="text-secondary pointer" href="#" onclick="goBack()">Torna indietro</a>
        </div>

        <div class="d-flex justify-content-between">
            <form method="post" th:action="@{/articles/accept(action='accept', articleId=${article.id})}">
                <button class="btn btn-success m-2" type="submit">
                    Accetta
                </button>
            </form>
            <form method="post" th:action="@{/articles/accept(action='reject', articleId=${article.id})}"
                  th:object="${article}">
                <button class="btn btn-danger m-2" type="submit">
                    Rifiuta
                </button>
            </form>
        </div>
    </div>
</div>

<head th:insert="~{index :: footer}"></head>

<script th:replace="~{index :: bootstrapScript}"></script>
<script>
    function goBack() {
        window.history.back();
    }
</script>
</body>
</html>
