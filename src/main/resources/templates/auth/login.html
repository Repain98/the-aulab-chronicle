<!DOCTYPE html>
<html lang="it" xmlns:th="http://thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
<head th:insert="~{index :: navbar}"></head>

<div class="vh-100">
    <br/><br/>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div th:if="${param.error}">
                    <div class="alert alert-danger">Invalid Email or Password</div>
                </div>
                <div th:if="${param.logout}">
                    <div class="alert alert-success">You have been logged out.</div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h2 class="text-center">Login Form</h2>
                    </div>
                    <div class="card-body">
                        <form class="form-horizontal" method="post" role="form" th:action="@{/login}">
                            <div class="form-group mb-3">
                                <label class="control-label">Email</label>
                                <input class="form-control" id="username" name="username"
                                       placeholder="Enter email address"
                                       type="text"/>
                            </div>
                            <div class="form-group mb-3">
                                <label class="control-label">Password</label>
                                <input class="form-control" id="password" name="password" placeholder="Enter password"
                                       type="password"/>
                            </div>
                            <div class="form-group mb-3">
                                <button class="btn btn-primary" type="submit">Submit</button>
                                <span>Not registered?
                                        <a th:href="@{/register}">Register/Signup here</a>
                                    </span>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<head th:insert="~{index :: footer}"></head>

<script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
