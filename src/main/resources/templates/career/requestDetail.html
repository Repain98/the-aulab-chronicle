<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
<head th:insert="~{index :: navbar}"></head>

<div class="vh-100">
    <div class="container-fluid p-5 bg-secondary-subtle text-center">
        <div class="row justify-content-center">
            <div class="col-12">
                <span class="h1">Richiesta</span>
            </div>
        </div>
    </div>
</div>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 d-flex flex-column">
            <div class="text-center">
                <h2 th:text="${request.user.username}">Nome utente</h2>
            </div>
            <hr>
            <div class="col-12 col-md-8 d-flex flex-column align-items-center">
                <div>
                    <p th:text="${request.body}">Body</p>
                </div>
            </div>

            <div class="d-flex">
                <form method="post" th:action="@{/operations/career/request/accept/{id}(id=${request.id})}"
                      th:if="${request.status == 'NEW' or request.status == 'VIEWED'}">
                    <button class="btn btn-primary m-2" type="submit">
                        Accetta
                    </button>
                </form>
                <form method="post" th:action="@{/operations/career/request/reject/{id}(id=${request.id})}"
                      th:if="${request.status == 'NEW' or request.status == 'VIEWED'}">
                    <button class="btn btn-danger m-2" type="submit">
                        Rifiuta
                    </button>
                </form>
                <a class="btn btn-primary m-2" th:href="@{/admin/dashboard}">
                    Torna indietro
                </a>
            </div>
            <div class="mt-3" th:if="${request.status == 'ACCEPTED' or request.status == 'REJECTED'}">
                <span class="badge"
                      th:classappend="${request.status == 'ACCEPTED'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${request.statusLabel}"></span>
            </div>
        </div>
    </div>
</div>

<head th:insert="~{index :: footer}"></head>

<script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
