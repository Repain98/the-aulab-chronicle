<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
<head th:insert="~{index :: navbar}"></head>

<div class="vh-100">
    <div class="container">
        <div class="row">

            <div class="col-12 my-5 d-flex justify-content-between align-items-center">
                <div class="d-flex justify-content-center align-items-center flex-grow-1">
                    <h1 th:text="${title}">Inserisci una categoria</h1>
                </div>
            </div>

            <div class="col-12 my-5">
                <form method="POST" th:action="@{/categories}" th:object="${category}">
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label" for="name">Nome categoria</label>
                            <input class="form-control" id="name" placeholder="Inserisci il nome della categoria..."
                                   th:field="*{name}"
                                   type="text"/>
                            <p class="text-danger" th:errors="*{name}" th:if="${#fields.hasErrors('name')}"></p>
                        </div>
                    </div>

                    <button class="btn btn-success" type="submit">Crea categoria</button>
                </form>
            </div>
        </div>
    </div>
</div>

<head th:insert="~{index :: footer}"></head>

<script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
