<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
<head th:insert="~{index :: navbar}"></head>

<div class="min-vh-100">
    <div class="container-fluid p-5 bg-secondary-subtle text-center">
        <div class="row justify-content-center">
            <div class="col-12">
                <span class="h1">Modifica articolo</span>
                <h2 th:text="${article.title}">Titolo</h2>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-12 my-5">
                <form enctype="multipart/form-data" method="POST" th:action="@{/articles/update/{id}(id=${article.id})}"
                      th:object="${article}">
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label" for="title">Titolo</label>
                            <input class="form-control" id="title" placeholder="Inserisci un articolo..."
                                   th:field="*{title}"
                                   type="text"/>
                            <p class="text-danger" th:errors="*{title}" th:if="${#fields.hasErrors('title')}"></p>
                        </div>
                        <div class="col">
                            <label class="form-label" for="subtitle">Sottotitolo</label>
                            <input class="form-control" id="subtitle" placeholder="Inserisci un sottotitolo..."
                                   th:field="*{subtitle}"
                                   type="text"/>
                            <p class="text-danger" th:errors="*{subtitle}" th:if="${#fields.hasErrors('subtitle')}"></p>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="body">Articolo:</label>
                        <input class="form-control" id="body" placeholder="Inserisci un testo..." th:field="*{body}"
                               type="text"/>
                        <p class="text-danger" th:errors="*{body}" th:if="${#fields.hasErrors('body')}"></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="publishDate">Data di pubblicazione</label>
                        <input class="form-control" id="publishDate" placeholder="yyyyMMdd" th:field="*{publishDate}"
                               type="date"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="category">Categoria</label>
                        <select class="form-select" id="category" th:field="*{category}">
                            <option th:each="category:${categories}" th:text="${category.name}"
                                    th:value="${category.id}"></option>
                        </select>
                        <p class="text-danger" th:errors="*{category}" th:if="${#fields.hasErrors('category')}"></p>
                    </div>

                    <div class="mb-3 d-flex flex-column" th:if="${article.image != null}">
                        <label class="form-label" for="image">Immagine dell'articolo</label>
                        <img th:alt="${article.image.path}" th:src="${article.image.path}">
                    </div>
                    <div th:unless="${article.image != null}">
                        <label class="form-label" for="image">Immagine dell'articolo</label>
                        <p>Immagine non presente</p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="image">Immagine</label>
                        <input class="form-control" id="image" name="file" type="file"/>
                    </div>

                    <button class="btn btn-success" type="submit">Modifica articolo</button>
                </form>
            </div>
        </div>
    </div>
</div>

<head th:insert="~{index :: footer}"></head>

<script th:replace="~{index :: bootstrapScript}"></script>
</body>
</html>
